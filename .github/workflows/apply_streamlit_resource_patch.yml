name: Apply Streamlit resource patch

on:
  push:
    branches:
      - fix/streamlit-surface-beads-short-md-resources

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Streamlit UI and viewer safeguards'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/streamlit-surface-beads-short-md-resources
          fetch-depth: 0

      - name: Patch Streamlit app and trajectory viewer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('streamlit_app.py')
          text = app.read_text()
          old = 'from streamlit_app.structure import StructureSummary, summarize_structure\nfrom streamlit_app.theme import apply_theme\n'
          new = 'from streamlit_app.structure import StructureSummary, summarize_structure\nfrom streamlit_app.surface_reference import render_surface_bead_reference\nfrom streamlit_app.theme import apply_theme\n'
          if old in text and 'surface_reference import render_surface_bead_reference' not in text:
              text = text.replace(old, new, 1)

          old = '    st.caption("All generated surface workflows use Martini 3 compatible bead definitions.")\n    if st.session_state.surface_workflow == "Hexagonal Lattice":\n'
          new = '    st.caption("All generated surface workflows use Martini 3 compatible bead definitions.")\n    render_surface_bead_reference()\n    if st.session_state.surface_workflow == "Hexagonal Lattice":\n'
          if old in text and '    render_surface_bead_reference()\n' not in text:
              text = text.replace(old, new, 1)
          app.write_text(text)

          viewer = Path('streamlit_app/molecular_viewer.py')
          text = viewer.read_text()
          old = 'import io\nimport json\nimport subprocess\n'
          new = 'import io\nimport json\nimport math\nimport subprocess\n'
          if old in text and '\nimport math\n' not in text:
              text = text.replace(old, new, 1)

          old = 'MAX_TRAJECTORY_GIF_FRAMES = 10\n'
          new = 'MAX_TRAJECTORY_GIF_FRAMES = 10\nMAX_TRAJECTORY_PREVIEW_ATOM_FRAMES = 300_000\nMAX_TRAJECTORY_PREVIEW_PDB_BYTES = 24 * 1024 * 1024\n'
          if old in text and 'MAX_TRAJECTORY_PREVIEW_ATOM_FRAMES' not in text:
              text = text.replace(old, new, 1)

          old = '''    if tpr_path and xtc_path and tpr_path.exists() and xtc_path.exists() and gmx_bin:\n        try:\n            with tempfile.TemporaryDirectory() as tmp:\n                pdb_path = Path(tmp) / "short_md_frames.pdb"\n                cmd = [\n                    gmx_bin,\n                    "trjconv",\n                    "-s",\n                    str(tpr_path),\n                    "-f",\n                    str(xtc_path),\n                    "-o",\n                    str(pdb_path),\n                    "-skip",\n                    str(max(1, int(frame_stride))),\n                ]\n                res = subprocess.run(cmd, input="0\\n", text=True, capture_output=True, check=False)\n                if res.returncode == 0 and pdb_path.exists() and pdb_path.stat().st_size > 0:\n                    pdb_data = pdb_path.read_text(errors="replace")\n                    model_mode = "trajectory"\n                    frame_count = pdb_data.count("MODEL")\n                else:\n                    conversion_error = (res.stderr or res.stdout or "Trajectory conversion failed.")[-600:]\n        except OSError as exc:\n            conversion_error = str(exc)\n'''
          new = '''    if tpr_path and xtc_path and tpr_path.exists() and xtc_path.exists() and gmx_bin:\n        try:\n            raw_frame_count = _trajectory_frame_count(xtc_path, gmx_bin)\n            atom_count = max(1, len(gro_atoms))\n            requested_stride = max(1, int(frame_stride))\n            max_frames_by_atoms = max(1, MAX_TRAJECTORY_PREVIEW_ATOM_FRAMES // atom_count)\n            resource_stride = (\n                max(1, math.ceil(raw_frame_count / max_frames_by_atoms))\n                if raw_frame_count\n                else requested_stride\n            )\n            effective_stride = max(requested_stride, resource_stride)\n            with tempfile.TemporaryDirectory() as tmp:\n                pdb_path = Path(tmp) / "short_md_frames.pdb"\n                cmd = [\n                    gmx_bin,\n                    "trjconv",\n                    "-s",\n                    str(tpr_path),\n                    "-f",\n                    str(xtc_path),\n                    "-o",\n                    str(pdb_path),\n                    "-skip",\n                    str(effective_stride),\n                ]\n                res = subprocess.run(cmd, input="0\\n", text=True, capture_output=True, check=False)\n                if res.returncode == 0 and pdb_path.exists() and pdb_path.stat().st_size > 0:\n                    pdb_size = pdb_path.stat().st_size\n                    if pdb_size > MAX_TRAJECTORY_PREVIEW_PDB_BYTES:\n                        conversion_error = (\n                            f"Trajectory preview skipped to protect Streamlit memory "\n                            f"({pdb_size / (1024 * 1024):.1f} MB converted PDB). "\n                            "Showing the final structure instead."\n                        )\n                    else:\n                        pdb_data = pdb_path.read_text(errors="replace")\n                        model_mode = "trajectory"\n                        frame_count = pdb_data.count("MODEL")\n                        if effective_stride > requested_stride:\n                            conversion_error = (\n                                f"Preview automatically downsampled with stride {effective_stride} "\n                                "to stay within the hosted-memory budget."\n                            )\n                else:\n                    conversion_error = (res.stderr or res.stdout or "Trajectory conversion failed.")[-600:]\n        except OSError as exc:\n            conversion_error = str(exc)\n'''
          if old not in text:
              raise SystemExit('trajectory block not found; refusing unsafe patch')
          text = text.replace(old, new, 1)
          viewer.write_text(text)
          PY

      - name: Run focused tests
        run: |
          python -m compileall -q streamlit_app.py streamlit_app
          pytest -q tests/test_short_md.py

      - name: Commit generated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streamlit_app.py streamlit_app/molecular_viewer.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Apply Streamlit UI and viewer safeguards"
          git push origin HEAD:fix/streamlit-surface-beads-short-md-resources
